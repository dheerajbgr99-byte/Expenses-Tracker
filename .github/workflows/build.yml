name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Auto-Detect & Extract Any ZIP File
        run: |
          echo "Looking for any zip file in repository..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE" -d extracted_temp
            
            # settings.gradle.kts dhoondho chahe kisi bhi folder me ho
            SETTINGS_DIR=$(find extracted_temp -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            if [ -n "$SETTINGS_DIR" ]; then
              echo "Found Gradle root in: $SETTINGS_DIR"
              shopt -s dotglob nullglob
              cp -rf "$SETTINGS_DIR"/* . 2>/dev/null || true
            else
              shopt -s dotglob nullglob
              cp -rf extracted_temp/* . 2>/dev/null || true
            fi
            rm -rf extracted_temp
          fi
          
          # Agar pehle se folder me commit ho
          if [ ! -f "settings.gradle.kts" ]; then
            SUB_DIR=$(find . -maxdepth 3 -name "settings.gradle.kts" -not -path "*/.*" -exec dirname {} \; | head -n 1)
            if [ -n "$SUB_DIR" ] && [ "$SUB_DIR" != "." ]; then
              echo "Moving files from: $SUB_DIR"
              shopt -s dotglob nullglob
              cp -rf "$SUB_DIR"/* . 2>/dev/null || true
            fi
          fi

      - name: Generate Android Resources & Config
        run: |
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">My Expense Tracker</string>
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MyExpenseTracker" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF
          cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content />
          EOF
          cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup />
              <device-transfer />
          </data-extraction-rules>
          EOF
          sed -i 's/@mipmap\/ic_launcher_round/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
          sed -i 's/@mipmap\/ic_launcher/@android:drawable\/sym_def_app_icon/g' app/src/main/AndroidManifest.xml || true
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AdvanceExpenseTracker-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
